  <circle cx="44" cy="8" r="3.2" fill="#FFFFFF"/>
  <line x1="44" y1="11" x2="44" y2="17" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Bot head (rounded square with speech-bubble tail) -->
